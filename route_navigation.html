let watch=null,marker=null,accuracy=null,follow=true,first=true;
const status=document.getElementById('status'),start=document.getElementById('start'),followBtn=document.getElementById('follow');
function nearest(lat,lng){const lat0=lat*Math.PI/180,kx=111320*Math.cos(lat0),ky=111320;let best=Infinity;for(const pts of lines)for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],ax=(a[1]-lng)*kx,ay=(a[0]-lat)*ky,bx=(b[1]-lng)*kx,by=(b[0]-lat)*ky,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/(dx*dx+dy*dy||1)));best=Math.min(best,Math.hypot(ax+t*dx,ay+t*dy));}return best;}
function update(pos){const {latitude:lat,longitude:lng,accuracy:acc,speed}=pos.coords;const ll=[lat,lng];if(!marker){marker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);}else marker.setLatLng(ll);if(!accuracy)accuracy=L.circle(ll,{radius:acc,color:'#1687ff',weight:1,fillOpacity:.08}).addTo(map);else accuracy.setLatLng(ll).setRadius(acc);const dist=nearest(lat,lng);document.getElementById('distance').textContent=Number.isFinite(dist)?fmt(dist):'--';document.getElementById('speed').textContent=speed!=null&&speed>=0?(speed*3.6).toFixed(1)+' km/h':'--';status.textContent='GPS受信中（精度 約'+Math.round(acc)+' m）'+(dist>40?' ・ ルートから離れています':'');if(follow)map.setView(ll,Math.max(map.getZoom(),16),{animate:!first});first=false;}
function fail(err){const messages={1:'位置情報が許可されていません。ブラウザの設定を確認してください。',2:'現在地を取得できません。GPSや通信状態を確認してください。',3:'位置情報の取得がタイムアウトしました。'};status.textContent=messages[err.code]||'位置情報の取得に失敗しました。';start.textContent='再試行';}
start.onclick=()=>{if(!navigator.geolocation){status.textContent='このブラウザは位置情報に対応していません。';return;}if(!window.isSecureContext){status.textContent='GPSを使うにはHTTPSでページを開いてください（localhostを除く）。';return;}if(watch!==null)navigator.geolocation.clearWatch(watch);status.textContent='GPSを取得しています…';watch=navigator.geolocation.watchPosition(update,fail,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});start.textContent='GPS更新中';};
followBtn.onclick=()=>{follow=!follow;followBtn.textContent='追従：'+(follow?'ON':'OFF');if(follow&&marker)map.setView(marker.getLatLng(),Math.max(map.getZoom(),16));};
document.getElementById('fit').onclick=()=>{follow=false;followBtn.textContent='追従：OFF';if(route.getBounds().isValid())map.fitBounds(route.getBounds(),{padding:[30,30]});};
map.on('dragstart',()=>{follow=false;followBtn.textContent='追従：OFF';});
</script></body></html>
